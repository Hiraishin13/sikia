name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une seule exécution par branche : un nouveau push annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (types, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      # `vite build` directement : `npm run build` télécharge ~17 Mo de modèles MediaPipe,
      # inutiles pour vérifier que l'app compile.
      - run: npx vite build

  api:
    name: API (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  ml:
    name: ML (tests, chaîne d'entraînement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            ml/pyproject.toml
      # PyTorch CPU : la version par défaut embarque CUDA (~2 Go), inutile ici.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # ml/ importe le prétraitement de api/ : les deux sont installés ensemble.
      - run: pip install -e api -e "ml[dev]"
      - run: ruff check ml
      - run: pytest -q
        working-directory: ml

[project]
name = "sikia-ml"
version = "0.1.0"
description = "Sikia : entraînement du modèle de reconnaissance de signes isolés"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "torch>=2.4",
]

[project.optional-dependencies]
islr = ["pandas>=2.2", "pyarrow>=16"]
dev = [
    "pandas>=2.2",
    "pyarrow>=16",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sikia_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

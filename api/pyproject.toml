[project]
name = "sikia-api"
version = "0.1.0"
description = "Backend Sikia : reconnaissance de signes à partir de points clés"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "anthropic>=1.0",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18"]
dev = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
